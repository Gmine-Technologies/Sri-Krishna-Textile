<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a143b"/>
      <stop offset="50%" stop-color="#4e0a23"/>
      <stop offset="100%" stop-color="#24040f"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="35%" stop-color="#ebc266"/>
      <stop offset="70%" stop-color="#ca9a3e"/>
      <stop offset="100%" stop-color="#996e20"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9dc"/>
      <stop offset="55%" stop-color="#eec974"/>
      <stop offset="100%" stop-color="#ba872d"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ornate Base Shield -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgG)" stroke="url(#goldG)" stroke-width="12" filter="url(#dropShadow)"/>
  <rect x="38" y="38" width="436" height="436" rx="90" fill="none" stroke="#e9bd5c" stroke-width="2.5" opacity="0.65"/>

  <!-- Ornate Corner Jewels -->
  <circle cx="66" cy="66" r="6" fill="url(#goldG)"/>
  <circle cx="446" cy="66" r="6" fill="url(#goldG)"/>
  <circle cx="66" cy="446" r="6" fill="url(#goldG)"/>
  <circle cx="446" cy="446" r="6" fill="url(#goldG)"/>

  <!-- Royal Lotus Motif at Top -->
  <g transform="translate(256, 128) scale(3.2)" fill="url(#goldG)" stroke="#4e2c07" stroke-width="0.6">
    <path d="M0 -22 C-6 -14 -7 -4 0 8 C7 -4 6 -14 0 -22 Z"/>
    <path d="M0 8 C-10 6 -18 -1 -19 -9 C-10 -9 -3 -2 0 8 Z"/>
    <path d="M0 8 C10 6 18 -1 19 -9 C10 -9 3 -2 0 8 Z"/>
    <path d="M0 8 C-14 9 -25 5 -31 -2 C-21 -5 -7 -1 0 8 Z"/>
    <path d="M0 8 C14 9 25 5 31 -2 C21 -5 7 -1 0 8 Z"/>
  </g>

  <!-- Brand Monogram "SK" -->
  <text x="256" y="324" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="165" fill="url(#goldText)" letter-spacing="4">SK</text>

  <!-- Store Title -->
  <text x="256" y="390" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="34" letter-spacing="9" fill="#fce4a6">SREEKRISHNA</text>
  <text x="256" y="426" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="500" font-size="20" letter-spacing="12" fill="#d4a342">- TEXTILES -</text>
</svg>